name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Package Release APKs
        run: |
          mkdir -p release-apk
          TAG_NAME="${GITHUB_REF_NAME:-v1.4.6}"
          cp app/build/outputs/apk/stable/release/app-stable-release.apk "release-apk/pesu-wifi-${TAG_NAME}-stable.apk"
          cp app/build/outputs/apk/beta/release/app-beta-release.apk "release-apk/pesu-wifi-${TAG_NAME}-tester.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-apk/*.apk
          generate_release_notes: true
