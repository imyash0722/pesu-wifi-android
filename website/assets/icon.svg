<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" />

  <!-- Shield Base Accent -->
  <path d="M256 96 L384 144 V264 C384 340 328 402 256 424 C184 402 128 340 128 264 V144 Z" 
        fill="#0F172A" opacity="0.25" />

  <!-- Wi-Fi Wave 3 (Outer) -->
  <path d="M144 216 A160 160 0 0 1 368 216" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" opacity="0.95" />

  <!-- Wi-Fi Wave 2 (Middle) -->
  <path d="M184 264 A104 104 0 0 1 328 264" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- Wi-Fi Wave 1 (Inner) -->
  <path d="M224 312 A48 48 0 0 1 288 312" fill="none" stroke="#38BDF8" stroke-width="24" stroke-linecap="round" />

  <!-- Center Dot / Pulse -->
  <circle cx="256" cy="360" r="22" fill="#FFFFFF" filter="url(#glow)" />

  <!-- Shield Accent Emblem at bottom right -->
  <g transform="translate(328, 328) scale(0.65)">
    <circle cx="96" cy="96" r="88" fill="#10B981" />
    <path d="M60 96 L86 122 L136 70" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
