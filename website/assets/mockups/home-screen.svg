<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#83969f" />
      <stop offset="100%" stop-color="#182329" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Device Body -->
  <rect x="10" y="10" width="340" height="720" rx="44" fill="#0c1115" stroke="url(#phoneBorder)" stroke-width="6" />

  <!-- Camera Cutout -->
  <circle cx="180" cy="32" r="7" fill="#182329" />

  <!-- Status Bar -->
  <text x="36" y="36" fill="#a8b6be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">14:37</text>
  <path d="M304 28 L314 36 L324 28 Z" fill="#a8b6be" />
  <rect x="302" y="27" width="22" height="12" rx="3" fill="none" stroke="#a8b6be" stroke-width="1.5" />
  <rect x="304" y="29" width="16" height="8" rx="1.5" fill="#4c9b80" />

  <!-- App Bar -->
  <text x="36" y="80" fill="#edf4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">PESU WiFi</text>
  <circle cx="320" cy="74" r="14" fill="#182329" />
  <path d="M315 74 H325 M320 69 V79" stroke="#c0cdd4" stroke-width="2" stroke-linecap="round" />

  <!-- Main Status Card -->
  <g filter="url(#cardShadow)">
    <rect x="28" y="110" width="304" height="230" rx="24" fill="#161f25" stroke="#354249" stroke-width="1" />
  </g>

  <!-- Pulsing Wi-Fi Shield in Card -->
  <circle cx="180" cy="170" r="36" fill="#4c9b80" fill-opacity="0.18" />
  <circle cx="180" cy="170" r="26" fill="#4c9b80" fill-opacity="0.3" />
  <!-- Mini Wifi Icon -->
  <path d="M166 164 A20 20 0 0 1 194 164" fill="none" stroke="#c0cdd4" stroke-width="3.5" stroke-linecap="round" />
  <path d="M172 172 A10 10 0 0 1 188 172" fill="none" stroke="#92e4c5" stroke-width="3" stroke-linecap="round" />
  <circle cx="180" cy="180" r="3" fill="#4c9b80" />

  <!-- Status Headline -->
  <text x="180" y="235" text-anchor="middle" fill="#edf4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">Authenticated</text>
  <text x="180" y="260" text-anchor="middle" fill="#c0cdd4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Connected as PES1UG20CS001</text>

  <!-- Status Pill Chip -->
  <rect x="110" y="285" width="140" height="28" rx="14" fill="#4c9b80" fill-opacity="0.25" />
  <circle cx="126" cy="299" r="4" fill="#4c9b80" />
  <text x="136" y="303" fill="#92e4c5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">PESU-EC-Campus</text>

  <!-- Active Account Selector Chip -->
  <rect x="28" y="360" width="304" height="48" rx="24" fill="#182329" stroke="#354249" stroke-width="1" />
  <circle cx="52" cy="384" r="12" fill="#83969f" />
  <text x="52" y="388" text-anchor="middle" fill="#92e4c5" font-size="11" font-weight="bold">U</text>
  <text x="74" y="389" fill="#edf4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">PES1UG20CS001</text>
  <path d="M305 380 L313 384 L305 388" fill="none" stroke="#a8b6be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Primary Connect/Disconnect Action Button -->
  <rect x="28" y="424" width="304" height="54" rx="27" fill="#8B3A3A" />
  <text x="180" y="457" text-anchor="middle" fill="#edf4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Disconnect</text>

  <text x="180" y="495" text-anchor="middle" fill="#a8b6be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Gateway Latency: 159 ms</text>

  <!-- Background Keepalive Card (Default Always Active) -->
  <rect x="28" y="525" width="304" height="68" rx="18" fill="#161f25" stroke="#354249" stroke-width="1" />
  <circle cx="56" cy="559" r="16" fill="#4c9b80" fill-opacity="0.2" />
  <!-- Sync icon -->
  <path d="M51 556 A7 7 0 0 1 61 553 L61 556" fill="none" stroke="#4c9b80" stroke-width="2" stroke-linecap="round" />
  <path d="M61 562 A7 7 0 0 1 51 565 L51 562" fill="none" stroke="#4c9b80" stroke-width="2" stroke-linecap="round" />
  <text x="82" y="552" fill="#edf4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Background Keepalive</text>
  <text x="82" y="572" fill="#92e4c5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Active (120s heartbeat ±30s jitter)</text>

  <!-- Footer Version -->
  <text x="180" y="660" text-anchor="middle" fill="#83969f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">PESU WiFi v1.7.4 · Production Build</text>

  <!-- Home Indicator bar -->
  <rect x="130" y="718" width="100" height="4" rx="2" fill="#39494e" />
</svg>
