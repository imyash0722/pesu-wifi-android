<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Device Body -->
  <rect x="10" y="10" width="340" height="720" rx="44" fill="#0B0F19" stroke="url(#phoneBorder)" stroke-width="6" />

  <!-- Camera Cutout -->
  <circle cx="180" cy="32" r="7" fill="#1E293B" />

  <!-- Status Bar -->
  <text x="36" y="36" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">14:37</text>
  <path d="M304 28 L314 36 L324 28 Z" fill="#94A3B8" />
  <rect x="302" y="27" width="22" height="12" rx="3" fill="none" stroke="#94A3B8" stroke-width="1.5" />
  <rect x="304" y="29" width="16" height="8" rx="1.5" fill="#10B981" />

  <!-- App Bar -->
  <text x="36" y="80" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">PESU WiFi</text>
  <circle cx="320" cy="74" r="14" fill="#1E293B" />
  <path d="M315 74 H325 M320 69 V79" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

  <!-- Main Status Card -->
  <g filter="url(#cardShadow)">
    <rect x="28" y="110" width="304" height="230" rx="24" fill="#131C31" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Pulsing Wi-Fi Shield in Card -->
  <circle cx="180" cy="170" r="36" fill="#10B981" fill-opacity="0.15" />
  <circle cx="180" cy="170" r="26" fill="#10B981" fill-opacity="0.25" />
  <!-- Mini Wifi Icon -->
  <path d="M166 164 A20 20 0 0 1 194 164" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />
  <path d="M172 172 A10 10 0 0 1 188 172" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
  <circle cx="180" cy="180" r="3" fill="#10B981" />

  <!-- Status Headline -->
  <text x="180" y="235" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">Authenticated</text>
  <text x="180" y="260" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Connected as PES1UG20CS001</text>

  <!-- Status Pill Chip -->
  <rect x="110" y="285" width="140" height="28" rx="14" fill="#10B981" fill-opacity="0.15" />
  <circle cx="126" cy="299" r="4" fill="#10B981" />
  <text x="136" y="303" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">PESU-EC-Campus</text>

  <!-- Active Account Selector Chip -->
  <rect x="28" y="360" width="304" height="48" rx="24" fill="#1E293B" />
  <circle cx="52" cy="384" r="12" fill="#3B82F6" />
  <text x="52" y="388" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">U</text>
  <text x="74" y="389" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">PES1UG20CS001</text>
  <path d="M305 380 L313 384 L305 388" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Primary Connect/Disconnect Action Button -->
  <rect x="28" y="424" width="304" height="54" rx="27" fill="#EF4444" />
  <text x="180" y="457" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Disconnect</text>

  <text x="180" y="495" text-anchor="middle" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Gateway Latency: 159 ms</text>

  <!-- Background Keepalive Card (Default Always Active) -->
  <rect x="28" y="525" width="304" height="68" rx="18" fill="#131C31" stroke="#1E293B" stroke-width="1" />
  <circle cx="56" cy="559" r="16" fill="#10B981" fill-opacity="0.15" />
  <!-- Sync icon -->
  <path d="M51 556 A7 7 0 0 1 61 553 L61 556" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  <path d="M61 562 A7 7 0 0 1 51 565 L51 562" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  <text x="82" y="552" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Background Keepalive</text>
  <text x="82" y="572" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Active (120s heartbeat ±30s jitter)</text>

  <!-- Footer Version -->
  <text x="180" y="660" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">PESU WiFi v1.6.1 · Production Build</text>

  <!-- Home Indicator bar -->
  <rect x="130" y="718" width="100" height="4" rx="2" fill="#334155" />
</svg>
