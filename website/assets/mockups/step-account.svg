<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="100%" height="100%">
  <defs>
    <filter id="accShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Screen -->
  <rect width="360" height="480" rx="36" fill="#1C1815" />

  <!-- Status Bar -->
  <text x="32" y="32" fill="#C0BDBC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">12:36</text>
  <rect x="306" y="22" width="22" height="12" rx="3" fill="none" stroke="#C0BDBC" stroke-width="1.5" />
  <rect x="308" y="24" width="16" height="8" rx="1.5" fill="#6C6E36" />

  <!-- App Header -->
  <text x="32" y="72" fill="#F2EDE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Add Campus Account</text>
  <text x="32" y="92" fill="#DFD3B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Hardware-encrypted via Android Keystore (AES-256)</text>

  <!-- Input Form Card -->
  <g filter="url(#accShadow)">
    <rect x="24" y="112" width="312" height="236" rx="22" fill="#26201B" stroke="#3D352E" stroke-width="1.5" />
  </g>

  <!-- Username / PRN field -->
  <text x="44" y="142" fill="#E3BD90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">PRN / USERNAME</text>
  <rect x="40" y="152" width="280" height="46" rx="12" fill="#1C1815" stroke="#675647" stroke-width="1" />
  <text x="56" y="180" fill="#F2EDE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">PES1UG20CS001</text>

  <!-- Password field -->
  <text x="44" y="222" fill="#E3BD90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">PASSWORD</text>
  <rect x="40" y="232" width="280" height="46" rx="12" fill="#1C1815" stroke="#675647" stroke-width="1" />
  <text x="56" y="260" fill="#C0BDBC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="3">••••••••••••</text>

  <!-- Save & Authenticate Button -->
  <rect x="40" y="292" width="280" height="44" rx="14" fill="#6C6E36" />
  <text x="180" y="319" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Save Account &amp; Connect</text>

  <!-- Quick connection card -->
  <rect x="24" y="360" width="312" height="54" rx="16" fill="#2E251E" stroke="#3D352E" stroke-width="1" />
  <circle cx="50" cy="387" r="14" fill="#6C6E36" fill-opacity="0.3" />
  <circle cx="50" cy="387" r="6" fill="#6C6E36" />
  <text x="74" y="382" fill="#F2EDE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Auto-Login Enabled</text>
  <text x="74" y="398" fill="#DFD3B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Detects portal in &lt;100ms and logs in seamlessly</text>

  <!-- Step badge -->
  <rect x="100" y="432" width="160" height="24" rx="12" fill="#E3BD90" />
  <text x="180" y="448" text-anchor="middle" fill="#2E251E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">STEP 5: READY &amp; CONNECTED</text>
</svg>
