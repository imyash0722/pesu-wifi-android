<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="100%" height="100%">
  <defs>
    <linearGradient id="notifGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#322822" />
      <stop offset="100%" stop-color="#241D18" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Screen -->
  <rect width="360" height="480" rx="36" fill="#151210" />

  <!-- Status Bar with Wi-Fi & Notification icons -->
  <text x="32" y="32" fill="#C0BDBC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">12:35</text>
  <!-- Mini Notification icons in status bar -->
  <circle cx="95" cy="28" r="4" fill="#E3BD90" />
  <path d="M106 25 L112 31 L118 25" stroke="#DFD3B5" stroke-width="1.5" fill="none" />
  <rect x="306" y="22" width="22" height="12" rx="3" fill="none" stroke="#C0BDBC" stroke-width="1.5" />
  <rect x="308" y="24" width="16" height="8" rx="1.5" fill="#6C6E36" />

  <!-- Notification Shade Header Mock -->
  <text x="32" y="68" fill="#F2EDE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Notifications</text>
  <text x="320" y="68" text-anchor="end" fill="#DFD3B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Clear all</text>

  <!-- THE CRUCIAL SYSTEM NOTIFICATION CARD -->
  <g filter="url(#cardGlow)">
    <rect x="18" y="86" width="324" height="205" rx="22" fill="url(#notifGrad)" stroke="#E3BD90" stroke-width="1.8" />
  </g>

  <!-- Notification Small Icon & Subheader -->
  <circle cx="42" cy="112" r="11" fill="#6C6E36" />
  <!-- Small wifi vector -->
  <path d="M37 111 A6 6 0 0 1 47 111" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="42" cy="115" r="1.5" fill="#FFFFFF" />

  <text x="60" y="113" fill="#DFD3B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Android System • Wi-Fi</text>
  <circle cx="202" cy="109" r="2" fill="#675647" />
  <text x="210" y="113" fill="#C0BDBC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Just now</text>

  <!-- Notification Title -->
  <text x="38" y="146" fill="#F2EDE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Connect to Wi-Fi network?</text>

  <!-- Notification Body -->
  <text x="38" y="172" fill="#DFD3B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">PESU WiFi suggested connecting to</text>
  <text x="38" y="192" fill="#E3BD90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">"PESU-EC-Campus"</text>

  <!-- Highlight Indicator Around Connect Button -->
  <rect x="180" y="222" width="144" height="46" rx="14" fill="#6C6E36" stroke="#E3BD90" stroke-width="2" />
  <!-- Hand pointer / Click marker -->
  <text x="252" y="250" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">CONNECT 👆</text>

  <rect x="38" y="226" width="124" height="38" rx="12" fill="#2E2620" />
  <text x="100" y="250" text-anchor="middle" fill="#C0BDBC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Don't connect</text>

  <!-- Explanatory Callout Box Below Card -->
  <rect x="18" y="306" width="324" height="110" rx="18" fill="#26201B" stroke="#675647" stroke-width="1" />
  <circle cx="42" cy="332" r="12" fill="#E3BD90" fill-opacity="0.25" />
  <text x="42" y="337" text-anchor="middle" fill="#E3BD90" font-size="13" font-weight="bold">!</text>

  <text x="62" y="330" fill="#E3BD90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Why it appears as a Notification:</text>
  <text x="62" y="350" fill="#F2EDE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Android 10+ handles AP suggestion approval</text>
  <text x="62" y="368" fill="#F2EDE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5"><tspan font-weight="bold" fill="#DFD3B5">via system notification</tspan> rather than an in-app dialog.</text>
  <text x="62" y="388" fill="#C0BDBC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Tap <tspan font-weight="bold" fill="#E3BD90">"Connect"</tspan> once to enable autonomous AP roaming.</text>

  <!-- Step badge -->
  <rect x="90" y="432" width="180" height="24" rx="12" fill="#E3BD90" />
  <text x="180" y="448" text-anchor="middle" fill="#2E251E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">STEP 4: AP SWITCH NOTIFICATION</text>
</svg>
