<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="100%" height="100%">
  <defs>
    <filter id="settShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Screen -->
  <rect width="360" height="480" rx="36" fill="#0c1115" />

  <!-- Status Bar -->
  <text x="32" y="32" fill="#a8b6be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">12:32</text>
  <rect x="306" y="22" width="22" height="12" rx="3" fill="none" stroke="#a8b6be" stroke-width="1.5" />
  <rect x="308" y="24" width="16" height="8" rx="1.5" fill="#4c9b80" />

  <!-- Settings Header -->
  <path d="M38 68 L32 74 L38 80" fill="none" stroke="#edf4f5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="54" y="78" fill="#edf4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">App battery usage</text>

  <!-- Explanation note -->
  <text x="28" y="112" fill="#c0cdd4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Manage background power to prevent standby dropouts</text>

  <!-- Option 1: Unrestricted (SELECTED) -->
  <g filter="url(#settShadow)">
    <rect x="24" y="132" width="312" height="82" rx="18" fill="#152620" stroke="#4c9b80" stroke-width="2" />
  </g>
  <!-- Radio checked -->
  <circle cx="52" cy="162" r="10" fill="none" stroke="#4c9b80" stroke-width="2" />
  <circle cx="52" cy="162" r="5" fill="#4c9b80" />
  <text x="74" y="156" fill="#edf4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Unrestricted</text>
  <rect x="180" y="144" width="80" height="18" rx="9" fill="#4c9b80" fill-opacity="0.3" />
  <text x="220" y="157" text-anchor="middle" fill="#92e4c5" font-size="10" font-weight="700">REQUIRED</text>
  <text x="74" y="176" fill="#c0cdd4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Allow app to run in background without</text>
  <text x="74" y="192" fill="#c0cdd4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">any battery restrictions when phone sleeps.</text>

  <!-- Option 2: Optimized (UNCHECKED) -->
  <rect x="24" y="226" width="312" height="66" rx="18" fill="#161f25" stroke="#354249" stroke-width="1" />
  <circle cx="52" cy="254" r="10" fill="none" stroke="#83969f" stroke-width="1.5" />
  <text x="74" y="250" fill="#a8b6be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Optimized</text>
  <text x="74" y="270" fill="#83969f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Android kills background keepalive after 3 mins</text>

  <!-- Exact Alarm Toggle Row -->
  <rect x="24" y="306" width="312" height="64" rx="18" fill="#152620" stroke="#354249" stroke-width="1" />
  <circle cx="50" cy="338" r="14" fill="#83969f" />
  <!-- Alarm clock icon -->
  <circle cx="50" cy="338" r="7" fill="none" stroke="#92e4c5" stroke-width="1.5" />
  <path d="M50 334 V338 H53" stroke="#92e4c5" stroke-width="1.5" stroke-linecap="round" />
  <text x="74" y="332" fill="#edf4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Alarms &amp; reminders</text>
  <text x="74" y="350" fill="#c0cdd4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Exact 120s RTC watchdog alarm</text>
  <!-- Switch toggle ON -->
  <rect x="272" y="326" width="46" height="24" rx="12" fill="#4c9b80" />
  <circle cx="305" cy="338" r="9" fill="#FFFFFF" />

  <!-- In-App Auto-Confirm Tip -->
  <rect x="24" y="382" width="312" height="34" rx="10" fill="#4c9b80" fill-opacity="0.15" />
  <text x="180" y="403" text-anchor="middle" fill="#92e4c5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">💡 Tip: Tap "Already set in Settings? Confirm" in the app</text>

  <!-- Step badge -->
  <rect x="100" y="432" width="160" height="24" rx="12" fill="#92e4c5" />
  <text x="180" y="448" text-anchor="middle" fill="#152620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">STEP 3: BATTERY &amp; ALARMS</text>
</svg>
